services:
  web:
    build: ./backend
    container_name: hostio-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # fails fast instead of starting a container that crashes on import
      TOKEN: ${TOKEN:?set TOKEN in src/server/.env or in the environment}
      DB_PATH: /code/database/hostio.db
      PROJECTS_DIR: /code/projects
    volumes:
      - projects_data:/code/projects
      - database_data:/code/database
      - caddy_sites:/code/caddy_sites
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"

    caddy:
    image: caddy:2
    container_name: hostio-caddy
    restart: unless-stopped
    ports:
        - "80:80"
        - "443:443"
        - "443:443/udp"
    volumes:
        - ./Caddyfile:/etc/caddy/Caddyfile:ro
        - caddy_sites:/etc/caddy/sites
        - caddy_data:/data
    networks: [proxy]

volumes:
  projects_data:
  database_data:
  caddy_data:
  caddy_sites:
