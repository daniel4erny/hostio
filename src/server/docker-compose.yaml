services:
  web:
    build: .
    container_name: hostio-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # fails fast instead of starting a container that crashes on import
      TOKEN: ${TOKEN:?set TOKEN in src/server/.env or in the environment}
      DB_PATH: /code/database/hostio.db
      PROJECTS_DIR: /code/projects
    volumes:
      - projects_data:/code/projects
      - database_data:/code/database
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"

volumes:
  projects_data:
  database_data:
